<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="description" content="Connect 4 vs Robot" />
        <meta name="author" content="iambriansreed" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1" />
        <title>Connect 4</title>
        <!-- Google tag (gtag.js), the same property as iambrian.com -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-N4JE182M9S"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag('js', new Date());
            gtag('config', 'G-N4JE182M9S');
        </script>
      <script type="module" crossorigin src="/assets/index-fPT3de9B.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-Dn-vfs-P.css">
    </head>
    <body>
        <div class="app">
            <div class="splash" id="splash">
                <div class="splash-inner">
                    <div class="dots">
                        <span class="dot p1"></span>
                        <span class="dot p2"></span>
                        <span class="dot p1"></span>
                        <span class="dot p2"></span>
                    </div>
                    <h1 class="splash-title">Connect 4</h1>
                    <p class="splash-subtitle">Crappy AI vs Human</p>
                </div>
            </div>
            <div id="board" data-turn="player1">
                <div class="next">
                    <div class="opening">
                        <div class="background">
                            <div></div>
                        </div>
                        <div class="foreground">
                            <div></div>
                        </div>
                    </div>
                    <div class="track">
                        <div class="column"></div>
                        <div class="column"></div>
                        <div class="column"></div>
                        <div class="column"></div>
                        <div class="column"></div>
                        <div class="column"></div>
                        <div class="column"></div>
                        <div class="checker player1">
                            <div>
                                <div><div></div></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="columns">
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                </div>
                <div class="foreground"></div>
            </div>
            <footer>
                <div class="credit">
                    Made with
                    <svg class="heart" viewBox="0 0 24 24" role="img" aria-label="love">
                        <path
                            d="M12 21s-7.5-4.6-9.8-9.2C.6 8.6 2.4 4.5 6.3 4.5c2.3 0 3.9 1.3 5.7 3.4 1.8-2.1 3.4-3.4 5.7-3.4 3.9 0 5.7 4.1 4.1 7.3C19.5 16.4 12 21 12 21z"
                        />
                    </svg>
                    by <a href="https://iambrian.com" target="_blank" rel="noopener">Brian</a>
                </div>
                <div class="version">1.3.5</div>
            </footer>
            <div id="size"></div>
            <div class="modal" id="game-start">
                <div class="backdrop"></div>
                <div class="dialog">
                    <h1 data-show="1" data-start="ai">Hello Human.</h1>
                    <p data-show="2">I am a robot.</p>
                    <p data-show="3">Can you beat me<span class="blink">?</span></p>
                    <div class="intro">
                        <div data-show="4">
                            <div class="checker player1">
                                <div>
                                    <div><div></div></div>
                                </div>
                            </div>
                            <p>human</p>
                        </div>
                        <div data-show="5">
                            <div class="checker player2">
                                <div>
                                    <div><div></div></div>
                                </div>
                            </div>
                            <p>robot</p>
                        </div>
                    </div>
                    <footer data-show="6">
                        <button type="button" class="btn" data-start>Start</button>
                    </footer>
                </div>
            </div>
            <div class="modal" id="game-over">
                <div class="backdrop"></div>
                <div class="dialog">
                    <h1 data-show="1"><span id="win-message">Win</span></h1>
                    <footer data-show="2">
                        <button type="button" data-restart class="btn">Reset</button>
                    </footer>
                </div>
            </div>
            <div class="modal" id="game-tie">
                <div class="backdrop"></div>
                <div class="dialog">
                    <h1>Tie Game!</h1>
                    <p>That was a good game.</p>
                    <footer>
                        <button type="button" data-restart class="btn">Reset</button>
                    </footer>
                </div>
            </div>
        </div>
    </body>
</html>
